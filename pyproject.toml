[project]
name = "github-top"
version = "1.0.0"
description = "Асинхронный сбор топа GitHub-репозиториев с активностью авторов и загрузка в ClickHouse"
readme = "README.md"
authors = [{ name = "Roman Medvedev", email = "roma23470@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.2,<4",
    "aiochclient>=2.6.0,<3",
    "asyncpg>=0.30.0,<0.31",
    "fastapi>=0.122.0,<0.124",
    "uvicorn[standard]>=0.38.0,<0.39",
    "pydantic-settings>=2.12.0,<3",
    "loguru>=0.7.3,<0.8",
]

[project.scripts]
github-top = "github_top.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "ruff>=0.14.7",
    "mypy>=1.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_top"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["github_top"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "postgres: нужен PostgreSQL (TEST_POSTGRES_DSN)",
    "clickhouse: нужен ClickHouse (TEST_CLICKHOUSE_URL)",
]
