services:
  api:
    build: .
    environment:
      POSTGRES_DSN: postgresql://github_top:github_top@postgres:5432/github_top
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  loader:
    build: .
    command: ["github-top", "load"]
    env_file:
      - path: .env
        required: false
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
    depends_on:
      clickhouse:
        condition: service_healthy
    profiles: ["jobs"]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: github_top
      POSTGRES_PASSWORD: github_top
      POSTGRES_DB: github_top
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U github_top"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "8123:8123"
    volumes:
      - ./src/github_top/sql/clickhouse_schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clickhouse:
