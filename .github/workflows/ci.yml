name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: github_top
          POSTGRES_PASSWORD: github_top
          POSTGRES_DB: github_top
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U github_top" --health-interval 5s --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 8123:8123
        options: --health-cmd "wget -qO- http://localhost:8123/ping" --health-interval 5s --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql://github_top:github_top@localhost:5432/github_top
      TEST_CLICKHOUSE_URL: http://localhost:8123
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pytest -q
